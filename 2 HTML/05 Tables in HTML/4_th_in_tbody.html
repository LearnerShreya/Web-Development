<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>th in tbody</title>
</head>
<body>
    <!-- using th in tbody is not a good practice. though i am using it for now. later i will use css for making data of certain cell bold. -->
    <table border="1">
        <thead>
            <tr>
                <th colspan="6">Time Table</th>
            </tr>

        </thead>

        <tbody>
            <tr>
                <th rowspan="6">HOURS</th>
                <th>Mon</td>
                <th>Tue</th>
                <th>Wed</th>
                <th>Thu</th>
                <th>Fri</th>
            </tr>

            <tr>
                <td>Maths</td>
                <td>Science</td>
                <td>Maths</td>
                <td>Science</td>
                <td>Arts</td>
            </tr>

            <tr>
                <td>Maths</td>
                <td>Science</td>
                <td>Maths</td>
                <td>Science</td>
                <td>Arts</td>
            </tr>

            <tr>
                <th colspan="5">LUNCH</th>
            </tr>

            <tr>
                <td>Maths</td>
                <td>Science</td>
                <td>Maths</td>
                <td>Science</td>
                <th rowspan="2">Project</th>
            </tr>

            <tr>
                <td>Maths</td>
                <td>Science</td>
                <td>Maths</td>
                <td>Science</td>
            </tr>
        </tbody>
    </table>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rowspan colspan</title>
</head>
<body>
    <!--     
    <td rowspan=" "> </td>
    <td colspan=" "> </td> 
    -->

    <table border=".5">
        <thead>
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Age</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Priya</td>
                <td>Sharma</td>
                <td>24</td>
            </tr>
            
            <tr>
                <td>Arun</td>
                <td>Singh</td>
                <td>27</td>
            </tr>
            <tr>
                <td>Sam</td>
                <td>Watson</td>
                <td>41</td>
            </tr>

        </tbody>
    </table>
    <br>

    <table border=".5">
        <thead>
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Age</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Priya</td>
                <td colspan="2">Sharma</td>
            </tr>
            
            <tr>
                <td>Arun</td>
                <td>Singh</td>
                <td rowspan="2">27</td>
            </tr>
            <tr>
                <td>Sam</td>
                <td>Watson</td>
            </tr>

        </tbody>
    </table>
    <br>



    <table border="1">
        <thead>
            <tr>
                <th>Column 1</th>
                <th>Column 2</th>
                <th>Column 3</th>
            </tr>
        </thead>
            <tr>
                <td colspan="2">Row 1 Columns 1-2</td>
                <td>Row 1 Column 3</td>
            </tr>
            <tr>
                <td colspan="3">Row 2 Columns 1-3</td>
            </tr>
        <tbody>

        </tbody>
    </table>




</body>
</html>

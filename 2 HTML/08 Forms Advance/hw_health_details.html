<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Details Form</title>
</head>
<body>
    <h1>Health Details Form</h1>

    <fieldset>
        <legend>Personal Information</legend>
        <label for="fname">Full Name</label>
        <input type="text" name="full name" id="fname"><br><br>

        <label for="dob">Date of Birth</label>
        <input type="date" name="DOB" id="dob"><br><br>

        
        <label for="sex">Gender</label>
        <select name="gender" id="sex">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select><br><br>

        <label for="no">Phone Number:</label>
        <input type="tel" name="contact" id="no">
    </fieldset>


    <fieldset>
        <legend>Medical History</legend>
        <label for="blood">Blood Group:</label>
        <select name="blood group" id="blood">
            <option value="A+">A+</option> 
            <option value="B+">B+</option> 
            <option value="A-">A-</option> 
            <option value="B-">B-</option> 
            <option value="O">O</option> 
        </select><br><br>

        <label for="lenses">Do you wear glasses or contact lenses?</label> <br>
        <input type="radio" name="" id="">
        <label for="">Yes</label> <br>
        <input type="radio" name="" id="">
        <label for="">No</label> <br><br>

        <label for="con">Pre-existing Conditions:</label><br>
        <textarea name="conditins" id="con" placeholder="List any pre-existing medical conditions" cols="40" rows="4"></textarea><br><br>

        <label for="allergies">Allergies</label><br>
        <input type="checkbox" name="pollen" id="pl">
        <label for="pl">Pollen</label><br>
        <input type="checkbox" name="peanuts" id="l">
        <label for="pn">Peanuts</label><br>
        <input type="checkbox" name="latex" id="pn">
        <label for="l">Latex</label><br>
        <input type="checkbox" name="none" id="n">
        <label for="n">None</label><br><br>

        <label for="cm">Current Medications:</label><br>
        <textarea name="Current Medications" id="cm" rows="4" cols="40" placeholder="List any current medications"></textarea>
        
        
    </fieldset>


    <fieldset>
        <legend>Emergency Contact</legend>

        <label for="ecn">Emergency Contact Name:</label>
        <input type="text" name="Emergency Name" id="ecn"><br><br>

        <label for="ecp">Emergency Contact Phone:</label>
        <input type="text" name="Emergency
        Phone" id="ecp"><br><br>

        <label for="rec">Relationship to Emergency Contact:</label>
        <input type="text" name="Relation" id="rec">
    </fieldset>

    <button>Submit</button>
</body>
</html>

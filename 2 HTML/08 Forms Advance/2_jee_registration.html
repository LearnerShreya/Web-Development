<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    
    <form action="">
        
        <fieldset>
            <legend>IT JEE Registration Form</legend>
            
        <fieldset>
            <legend>User Info</legend>

            <!-- Full Name Input -->
             
        <label for="fullName">Full Name:</label>
        <input type="text" id="fullName" name="fullName" >
        <br><br>
        
        <!-- Email Input -->
        <label for="email">Email:</label>
        <input type="email" id="email" name="email">
        <br><br>
        
        <!-- Phone Number Input -->
        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone">
        <br><br>

        <!-- Password Input -->
        <label for="password">Password:</label>
        <input type="password" id="password" name="password">
        <br><br>
        </fieldset>

        <fieldset>
            <legend>User Other Info</legend>
            <!-- Gender Selection (Radio Buttons) -->
        <label>Gender:</label>
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label>
        <br><br>
        
        <!-- Date of Birth Input -->
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" placeholder="dd/mm/yyyy" min="2001-01-01" max="2005-12-31">
        <br><br>

        <!-- School Name Input -->
        <label for="schoolName">School Name:</label>
        <input type="text" id="schoolName" name="schoolName">
        <br><br>

        <!-- Board Selection (Dropdown) -->
        <label for="board">Board:</label>
        <select id="board" name="board">
            <option value="" disabled selected>Select your Board</option>
            <option value="CBSE">CBSE</option>
            <option value="ICSE">ICSE</option>
            <option value="StateBoard">State Board</option>
            <option value="Other">Other</option>
        </select>
        <br><br>
        
        <!-- Year of Passing Input -->
        <label for="yearOfPassing">Year of Passing:</label>
        <input type="number" id="yearOfPassing" name="yearOfPassing" min="2023" max="2025">
        <br><br>

        <!-- Exam Center Selection (Dropdown) -->
        <label for="examCenter">Exam Center:</label>
        <select id="examCenter" name="examCenter">
            <option value="" disabled selected>Select Center</option>
            <option value="Center1">Center 1</option>
            <option value="Center2">Center 2</option>
            <option value="Center3">Center 3</option>
        </select>
        <br><br>

        <!-- Register Button -->
        <button type="submit">Register</button>
        </fieldset>

        </fieldset>
    </form>

</body>
</html>

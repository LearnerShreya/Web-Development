<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback form</title>
</head>
<body>
    <h2>Feedback form</h2>
    <form action="">
        <label for="name">Your Name: </label>
        <input type="text" name="urname" id="name">
        <br><br>

        <label for="email">Your Email: </label>
        <input type="email" name="EmailId" id="email" required>
        <br><br>

        <label>Rate Us: </label>
        <input type="radio" name="rating" id="1" value="1 star" >
        <label for="1">1 Stars</label>
        <input type="radio" name="rating" id="2" value="1 star" >
        <label for="2">2 Stars</label>
        <input type="radio" name="rating" id="3" value="2 star" >
        <label for="3">3 Stars</label>
        <input type="radio" name="rating" id="4" value="3 star" >
        <label for="4">4 Stars</label>
        <input type="radio" name="rating" id="5" value="4 star" >
        <label for="5">5 Stars</label>
        <br><br>
        
        <label for="cmt">Comments: </label>
        <textarea name="Comment" id="cmt"></textarea>
        <br><br></br>

        <button>Submit Feedback</button>
    </form>
</body>
</html>

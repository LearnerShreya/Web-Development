<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
</head>
<body>
    <h2>Contact Us</h2>
    <form>
        <label for="fname">Full Name: </label>
        <input type="text" name="Name" id="fname" placeholder="Enter your name here"> 
        <br> 
        <br>
        <label for="email">Email: </label>
        <input type="email" name="EmailId" id="email"> 
        <br> 
        <br>
        <label for="contact">Phone Number: </label>
        <input type="tel" name="Contact no." id="contact"> 
        <br> 
        <br>
        <label for="pass">Password: </label>
        <input type="password" name="Password" id="pass">
        <br> 
        <br>
        <label for="msg">Message: </label>
        <textarea name="Message" id="msg" rows="10" cols="50" placeholder="Message here"></textarea>
        <br> 
        <br>
        <button>Send</button>
    </form>
</body>
</html>

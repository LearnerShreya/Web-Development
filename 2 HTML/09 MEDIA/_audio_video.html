<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Video</title>
</head>
<body>
    <!-- Audio  ko kaise attach kar sakte hai-->
     <audio src="./check.mp3" controls></audio><br>
     <!-- audio 2nd method ke kuch advantages hai -->
     <audio controls>
        <source src="./Jaadugar.mp3">
        <source src="./check.mp3">                   <!-- agar jadugar na baje to ye wala baja dena -->
        Songs are not loaded                         <!-- in case 1st and 2nd koi nahi baja -->
     </audio>
     <br>

     <!-- Video ko kaise attach kar sakte hai-->
      <video src="./hawa.MP4" height="400" width="250" controls></video>
      <video controls height="400" width="250" autoplay muted>
        <source src="./hawa.MP4" type="video/mp4">            
        <source src="./hawa.MP4" type="video/mp4">                     <!-- agar jadugar na chale to ye wala baja dena -->
        Video not played due to error                                   <!-- in case 1st and 2nd koi nahi baja -->
      </video>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML and CSS Revision</title>
    <!-- External CSS Link -->
    <link rel="stylesheet" href="styles.css">
    <!-- Internal CSS for Demonstration -->
    <style>
        h1 {
            color: blue;
            background-color: lightgray;
        }
        h2 {
            color: green;
            background-color: lightyellow;
        }
        ul {
            background-color: #f4f4f4;
        }
        h2[draggable="true"] {
            background-color: lightpink;
        }
        section > p {
            background-color: lightblue;
        }
    </style>
</head>
<body>
    <fieldset>
        <legend>HTML and CSS Example</legend>

        <!-- Inline, Internal, and External CSS -->
        <h1 style="color: red; background-color: lightblue; display: inline;">Inline CSS Example</h1>
        <p>This heading uses inline CSS to apply specific styles directly to the element.</p>
        
        <!-- Internal CSS -->
        <h1>Internal CSS Example</h1>
        <p>The above heading and this paragraph are styled using internal CSS defined within the `<style>` tag in the document head.</p>

        <!-- Unordered List Example -->
        <h2>Food Categories</h2>
        <ul>
            <li>Fruits</li>
            <li>Vegetables</li>
            <li>Grains</li>
            <li>Dairy</li>
        </ul>
        <p>The list above is styled using internal CSS. We’ve added a background color for visual separation.</p>

        <!-- Class and ID Example -->
        <h2 class="first">Class Attribute Example</h2>
        <p class="first">This paragraph is styled using a class selector, which applies the same styles to multiple elements.</p>

        <h3 id="unique">ID Attribute Example</h3>
        <p>The heading above uses an ID selector to apply unique styling, as IDs should be used for elements that are unique within a document.</p>

        <!-- Contenteditable Attribute -->
        <h2 contenteditable="true">Editable Content Example</h2>
        <p>You can click on the text in the above heading and edit it directly in the browser, thanks to the `contenteditable` attribute.</p>

        <!-- Draggable Attribute -->
        <h2 draggable="true">Draggable Content Example</h2>
        <p>This heading is draggable because of the `draggable` attribute set to "true". You can drag it to different areas in the browser window.</p>
        
        <hr>

        <!-- Section and Child Selector Example -->
        <section>
            <div>
                <p>This paragraph is inside a `<div>` within a `<section>`. The child selector is applied to the paragraph directly within the section.</p>
            </div>

            <p>This is another paragraph directly inside the `<section>`. The child selector styles this one specifically due to its parent-child relationship.</p>
        </section>
    </fieldset>
</body>
</html>

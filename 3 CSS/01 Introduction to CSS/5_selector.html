<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Selector</title>
    <link rel="stylesheet" href="./5_selector.css">
</head>
<body>
<fieldset>
    <!-- Selector -->
    <h1>Selector</h1> <hr>
    <h1>Hello Coder Army</h1>

    <!-- parent -->
    <ul>
        <!-- child  -->
        <li>Nuts</li>
        <li>Milk</li>
        <li>Fruits</li>
        <li>Vegetables</li>
    </ul>
    
    <!-- HTML properties : contenteditable, draggable -->
    <h2 contenteditable="true">I am best in the world</h2>

    <!-- method 1 to select draggable -->
    <!-- <h2 draggable="true" id="fouth">Hello ji</h2> -->
    <!-- method 2 to select draggable -->
    <h2 draggable="true">Hello ji</h2>
    <h3 id="third">Money fame</h3>
    <p>honey boney kaise ho</p>
    <hr>

    <section>
        <div>
            <p>I am first para</p>
        </div>

        <p>I am second para</p>
    </section>

    <section>
        <div>
            <h2>Hello paaji</h2>
        </div>
    </section>


</fieldset>
</body>
</html>

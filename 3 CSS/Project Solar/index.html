<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Solar System</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="solar-system">
    <div class="sun" data-name="Sun" data-info="The star at the center of our solar system."></div>
    <div class="orbit mercury-orbit">
      <div class="planet mercury" data-name="Mercury" data-info="The smallest planet, closest to the Sun."></div>
    </div>
    <div class="orbit venus-orbit">
      <div class="planet venus" data-name="Venus" data-info="Second planet from the Sun, with a thick, toxic atmosphere."></div>
    </div>
    <div class="orbit earth-orbit">
      <div class="planet earth" data-name="Earth" data-info="Our home planet, the third from the Sun."></div>
      <div class="moon-orbit">
        <div class="moon" data-name="Moon" data-info="Earth's only natural satellite."></div>
      </div>
    </div>
    <div class="orbit mars-orbit">
      <div class="planet mars" data-name="Mars" data-info="The 'Red Planet,' fourth from the Sun."></div>
    </div>
  </div>

  <div class="tooltip" id="tooltip"></div>

  <script src="script.js"></script>
</body>
</html>
